name: Synchronize Neon lockfile

on:
  push:
    branches: [feature/ambient-listening-bridge]
    paths:
      - ".github/workflows/sync-neon-lock.yml"

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ambient-listening-bridge
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save lockfile on this feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(web): synchronize Neon dependency lockfile"
            git push origin HEAD:feature/ambient-listening-bridge
          fi
