name: Ambient Hub Tests

on:
  push:
    branches: [feature/ambient-listening-bridge]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check worker/src/index.mjs
      - run: node --check worker/src/merge.mjs
      - run: node --test worker/test/*.test.mjs
      - run: npm install --no-audit --no-fund
        working-directory: worker
      - run: npx wrangler deploy --dry-run
        working-directory: worker
